# USC Evidence Collector - Velociraptor offline collector
OS: Windows
Artifacts:
  Generic.Client.Info: {}
  Windows.Applications.Chrome.History: {}
  Windows.Applications.Edge.History: {}
Target: ZIP
TargetArgs: {}
EncryptionScheme: None
EncryptionArgs: {}
OptVerbose: true
OptBanner: false
OptPrompt: false
OptAdmin: true
OptLevel: 5
OptConcurrency: 2
OptFormat: jsonl
OptFilenameTemplate: "Collection-%Hostname%-%TIMESTAMP%"
OptCollectorTemplate: "Collector_Windows_browser"
OptCpuLimit: 50
OptProgressTimeout: 1800
OptTimeout: 3600
OptDeleteAtExit: true
